<div class="catalog-list">
	<table class="catalog-table" border="1">
		<tbody *ngFor="let category of categories">
			<tr>
				<td colspan="2">Ma Danh Muc</td>
				<td colspan="2">Ten Danh Muc</td>
			</tr>
			<tr>
				<td colspan="2">{{ category.Cateid }}</td>
				<td colspan="2">{{ category.CateName }}</td>
			</tr>
			<tr>
				<td>Ma San Pham</td>
				<td>Ten San Pham</td>
				<td>Gia San Pham</td>
				<td>Picture</td>
			</tr>
			<tr *ngFor="let product of category.Products">
				<td>{{ product.ProductId }}</td>
				<td>{{ product.ProductName }}</td>
				<td>{{ product.Price }}</td>
				<td>
					<img [src]="product.Image" [alt]="product.ProductName" width="60" height="60">
				</td>
			</tr>
		</tbody>
	</table>
</div>
